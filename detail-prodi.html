<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Program Studi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/detail-prodi.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="container">
        <h1 class="logo"><a href="homepage.html">Tel-U Connection</a></h1>

        <ul class="nav-links">
          <li><a href="Tel-U-Ask.html">Tel-U Ask</a></li>
          <li><a href="fakulltas.html">Fakultas</a></li>
          <li><a href="UKM.html">UKM</a></li>
        </ul>

        <form action="search.html" method="GET" class="search-box">
          <input type="text" name="q" placeholder="Cari pertanyaan..." required>
          <button type="submit">
            <span class="material-symbols-outlined">search</span>
          </button>
        </form>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero-section">
    <img class="hero-image" src="media/FIT.png" alt="Hero Prodi">
    <div class="hero-content">
      <p class="nama-fakultas-text"></p>
      <h1 class="nama-prodi-text"></h1>
      <p class="jenjang-prodi-text"></p>
      <p class="tagline-prodi-text"></p>
      <button class="subscribe-prodi-btn">Subscribe Program Studi</button>
    </div>
  </section>

  <!-- Konten utama -->
  <main class="main-section">
    <div class="grid">
      <!-- Kolom kiri -->
      <div class="col-2">
        <div class="card">
          <h2>Deskripsi Program Studi</h2>
          <p class="deskripsi-prodi-text"></p>
        </div>

        <div class="card">
          <h2>Visi dan Misi</h2>
          <h3>Visi</h3>
          <p class="visi-prodi-text"></p>
          <h3>Misi</h3>
          <ul class="misi-prodi-list"></ul>
        </div>

        <div class="card">
          <h2>Prospek Karir</h2>
          <ul class="prospek-karir-list"></ul>
        </div>
      </div>

      <!-- Kolom kanan (dulu aside) -->
      <div class="col-1">
        <div class="card">
          <h2>Info Singkat</h2>
          <p><span>Jenjang</span> : <span class="jenjang-prodi-side-text"></span></p>
          <p><span>Gelar Lulusan</span> : <span class="gelar-prodi-text"></span></p>
          <p><span>Akreditasi</span> : <span class="akreditasi-prodi-text"></span></p>
          <p><span>Durasi Studi</span> : <span class="durasi-prodi-text"></span></p>
        </div>

        <div class="card">
          <h2>Kontak</h2>
          <p class="email-prodi-text"></p>
          <p class="website-prodi-link"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>copy 2025 Tel-U Connection. All Rights Reserved.</p>
  </footer>

  <script src="JS/detail-prodi.js"></script>
</body>
</html>

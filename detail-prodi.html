<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Program Studi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/detail-prodi.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="container">
        <h1 class="logo"><a href="homepage.html">Tel-U Connection</a></h1>

        <ul class="nav-links">
          <li><a href="Tel-U-Ask.html">Tel-U Ask</a></li>
          <li><a href="fakulltas.html">Fakultas</a></li>
          <li><a href="UKM.html">UKM</a></li>
        </ul>

        <form action="search.html" method="GET" class="search-box">
          <input type="text" name="q" placeholder="Cari pertanyaan..." required>
          <button type="submit">
            <span class="material-symbols-outlined">search</span>
          </button>
        </form>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section id="heroSection">
    <img id="heroImage" src="media/FIT.png" alt="Hero Prodi">
    <div class="hero-content">
      <p id="namaFakultas"></p>
      <h1 id="namaProdi"></h1>
      <p id="jenjangProdi"></p>
      <p id="taglineProdi"></p>
      <button id="subscribeProdiBtn">Subscribe Program Studi</button>
    </div>
  </section>

  <!-- Konten utama -->
  <main>
    <div class="grid">
      <!-- Kolom kiri -->
      <section class="col-2">
        <div class="card">
          <h2>Deskripsi Program Studi</h2>
          <p id="deskripsiProdi"></p>
        </div>

        <div class="card">
          <h2>Visi dan Misi</h2>
          <h3>Visi</h3>
          <p id="visiProdi"></p>
          <h3>Misi</h3>
          <ul id="misiProdi"></ul>
        </div>

        <div class="card">
          <h2>Prospek Karir</h2>
          <ul id="prospekKarir"></ul>
        </div>
      </section>

      <!-- Kolom kanan -->
      <aside class="col-1">
        <div class="card">
          <h2>Info Singkat</h2>
          <p><span>Jenjang</span> : <span id="jenjangProdiSide"></span></p>
          <p><span>Gelar Lulusan</span> : <span id="gelarProdi"></span></p>
          <p><span>Akreditasi</span> : <span id="akreditasiProdi"></span></p>
          <p><span>Durasi Studi</span> : <span id="durasiProdi"></span></p>
        </div>

        <div class="card">
          <h2>Kontak</h2>
          <p id="emailProdi"></p>
          <p id="websiteProdi"></p>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <p>copy 2025 Tel-U Connection. All Rights Reserved.</p>
  </footer>

  <script src="JS/detail-prodi.js"></script>
</body>
</html>
